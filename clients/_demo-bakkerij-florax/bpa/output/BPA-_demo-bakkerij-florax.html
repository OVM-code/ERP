/* BPA interactive viewer — self-contained, inlined at build time.
 * Visual identity: Cegeka (bpa/branding/tokens.css is inlined before this file;
 * the --cg-* custom properties and logo data-URIs are defined there/at build). */
:root {
  --accent: var(--cg-cyan-deep, #0079a1);
  --accent-soft: var(--cg-cyan-tint, #e6f9fe);
  --brand: var(--cg-cyan, #00c7f9);
  --ink: var(--cg-ink, #001d24);
  --ink-soft: #4a5c62;
  --line: #dbe4e7;
  --bg: #f4f8f9;
  --card: #ffffff;
  --fit-standard: var(--cg-cyan-deep, #0079a1);
  --fit-standard-bg: var(--cg-cyan-tint, #e6f9fe);
  --fit-standard-line: #9fe4fb;
  --fit-addon: var(--cg-purple, #632064);
  --fit-addon-bg: var(--cg-purple-tint, #f4ecf4);
  --fit-addon-line: #d9bcda;
  --fit-workaround: #b45309;
  --fit-workaround-bg: #fffbeb;
  --fit-workaround-line: #fde68a;
  --fit-gap: #d92e30;
  --fit-gap-bg: var(--cg-coral-tint, #fdeeee);
  --fit-gap-line: #f8bcbc;
  --fit-none: #8195a9;
  --fit-none-bg: #f8fafc;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(0, 29, 36, .06), 0 4px 14px rgba(0, 29, 36, .08);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 15px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
  color: var(--ink);
  background: var(--bg);
}
#app { display: flex; flex-direction: column; height: 100vh; }

/* ---------- header (white, Cegeka logo, cyan accent bar) ---------- */
.hdr {
  background: var(--card); color: var(--ink);
  border-top: 4px solid var(--brand);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 18px;
  padding: 10px 22px; flex: none;
}
.hdr .logo {
  flex: none; width: 118px; height: 26px;
  background: var(--cg-logo-dark) no-repeat left center / contain;
}
.hdr .brand { font-weight: 700; font-size: 16px; letter-spacing: .2px; white-space: nowrap; }
.hdr .brand small { display: block; font-weight: 400; font-size: 11.5px; color: var(--ink-soft); }
.hdr nav { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; align-items: center; }
.hdr nav a {
  color: var(--ink-soft); text-decoration: none; padding: 7px 14px; border-radius: 20px;
  font-size: 13.5px;
}
.hdr nav a:hover { background: var(--accent-soft); color: var(--ink); }
.hdr nav a.on { background: var(--brand); color: var(--ink); font-weight: 600; }
.hdr nav .export {
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 20px; padding: 6px 14px; font: inherit; font-size: 13px;
  cursor: pointer; margin-left: 8px; white-space: nowrap;
}
.hdr nav .export:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- layout ---------- */
.main { display: flex; flex: 1; min-height: 0; }
.side {
  width: 264px; flex: none; background: var(--card);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0;
}
.side .search { padding: 12px 12px 8px; }
.side .search input {
  width: 100%; padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px;
  font: inherit; font-size: 13.5px; outline: none; background: var(--bg);
}
.side .search input:focus { border-color: var(--accent); background: #fff; }
.side .domlist { overflow-y: auto; padding: 4px 8px 16px; }
.side .domlist a {
  display: flex; align-items: baseline; gap: 8px;
  padding: 8px 10px; border-radius: 8px; text-decoration: none;
  color: var(--ink); font-size: 13.5px;
}
.side .domlist a .n { color: var(--ink-soft); font-size: 11.5px; min-width: 16px; font-weight: 600; }
.side .domlist a .cnt {
  margin-left: auto; font-size: 11px; color: var(--ink-soft);
  background: var(--bg); border-radius: 20px; padding: 1px 8px;
}
.side .domlist a:hover { background: var(--accent-soft); }
.side .domlist a.on { background: var(--brand); color: var(--ink); font-weight: 600; }
.side .domlist a.on .n { color: var(--ink); }
.side .domlist a.on .cnt { color: var(--ink); background: rgba(255,255,255,.55); }
.side .hits { overflow-y: auto; padding: 0 12px 16px; }
.side .hits .hit {
  display: block; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
  margin-bottom: 6px; text-decoration: none; color: var(--ink); font-size: 12.5px;
}
.side .hits .hit code { color: var(--accent); font-weight: 600; }
.side .hits .hit:hover { border-color: var(--accent); }
.side .hits .none { color: var(--ink-soft); font-size: 13px; padding: 8px 4px; }

.content { flex: 1; overflow-y: auto; min-width: 0; padding: 22px 26px 60px; }
.content > .inner { max-width: 1500px; margin: 0 auto; }

/* ---------- generic ---------- */
h1.pg { font-size: 21px; margin: 2px 0 2px; }
.pg-sub { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 18px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 18px;
}
.chip {
  display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .3px;
  border-radius: 20px; padding: 2px 9px; vertical-align: 1px; white-space: nowrap;
}
.chip.standard { color: var(--fit-standard); background: var(--fit-standard-bg); border: 1px solid var(--fit-standard-line); }
.chip.addon { color: var(--fit-addon); background: var(--fit-addon-bg); border: 1px solid var(--fit-addon-line); }
.chip.workaround { color: var(--fit-workaround); background: var(--fit-workaround-bg); border: 1px solid var(--fit-workaround-line); }
.chip.gap { color: var(--fit-gap); background: var(--fit-gap-bg); border: 1px solid var(--fit-gap-line); }
.chip.none { color: var(--fit-none); background: var(--fit-none-bg); border: 1px solid var(--line); }
.chip.req { color: var(--accent); background: var(--accent-soft); border: 1px solid var(--fit-standard-line); cursor: pointer; }
.chip.link { cursor: pointer; }
code.bs { font: 600 12px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--accent); }

/* ---------- diagram ---------- */
.diagram-card { padding: 10px 12px 12px; overflow: hidden; }
.diagram-head { display: flex; align-items: center; gap: 12px; padding: 6px 8px 8px; flex-wrap: wrap; }
.diagram-head .zoom { margin-left: auto; display: flex; gap: 4px; }
.diagram-head .zoom button {
  border: 1px solid var(--line); background: #fff; border-radius: 7px; width: 30px; height: 28px;
  font-size: 15px; cursor: pointer; color: var(--ink-soft);
}
.diagram-head .zoom button:hover { border-color: var(--accent); color: var(--accent); }
.diagram-scroll { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
svg.bpmn { display: block; }
svg.bpmn text { font-family: "Segoe UI", system-ui, sans-serif; }
.bpmn .lane-band-0 { fill: #fbfdfe; }
.bpmn .lane-band-1 { fill: #f2f7f9; }
.bpmn .lane-label { fill: var(--ink-soft); font-size: 12px; font-weight: 600; letter-spacing: .4px; }
.bpmn .flow { stroke: #5f7379; stroke-width: 1.6; fill: none; }
.bpmn .flow-label { font-size: 11px; fill: var(--ink-soft); }
.bpmn .flow-label-bg { fill: #ffffff; opacity: .92; }
.bpmn .node { cursor: default; }
.bpmn .node.clickable { cursor: pointer; }
.bpmn .node.clickable:hover .shape { filter: brightness(.96); }
.bpmn .node .title { font-size: 12px; fill: var(--ink); }
.bpmn .node .code { font-size: 9.5px; font-weight: 700; fill: var(--ink-soft); }
.bpmn .node.selected .shape { stroke-width: 3; }
.bpmn .fit-standard .shape { stroke: var(--fit-standard); fill: var(--fit-standard-bg); }
.bpmn .fit-addon .shape { stroke: var(--fit-addon); fill: var(--fit-addon-bg); }
.bpmn .fit-workaround .shape { stroke: var(--fit-workaround); fill: var(--fit-workaround-bg); }
.bpmn .fit-gap .shape { stroke: var(--fit-gap); fill: var(--fit-gap-bg); }
.bpmn .fit-none .shape { stroke: var(--fit-none); fill: var(--fit-none-bg); stroke-dasharray: 5 3; }
.bpmn .n-start .shape { stroke: #15803d; fill: #f0fdf4; stroke-width: 2; }
.bpmn .n-end .shape { stroke: #b91c1c; fill: #fef2f2; stroke-width: 3.5; }
.bpmn .n-gateway .shape, .bpmn .n-gateway-parallel .shape { stroke: #5f7379; fill: #fefce8; stroke-width: 2; }
.bpmn .sub-mark { stroke: #5f7379; stroke-width: 1.6; fill: #fff; }
.bpmn .evt-label { font-size: 11px; fill: var(--ink-soft); }
.bpmn .gw-label { font-size: 11px; fill: var(--ink-soft); font-weight: 600; }
.bpmn .gw-mark { stroke: #5f7379; stroke-width: 2.4; }

.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-soft); padding: 10px 6px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; border: 2px solid; }

/* ---------- scenario cards under diagram ---------- */
.scen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 10px; }
.scen-card {
  background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--fit-none);
  border-radius: 8px; padding: 10px 13px; cursor: pointer;
}
.scen-card:hover { box-shadow: var(--shadow); }
.scen-card.standard { border-left-color: var(--fit-standard); }
.scen-card.addon { border-left-color: var(--fit-addon); }
.scen-card.workaround { border-left-color: var(--fit-workaround); }
.scen-card.gap { border-left-color: var(--fit-gap); }
.scen-card .t { font-weight: 600; font-size: 13.5px; margin: 2px 0 3px; }
.scen-card .m { font-size: 11.5px; color: var(--ink-soft); }
h2.sect { font-size: 15px; margin: 26px 0 10px; color: var(--ink-soft); font-weight: 600; }

/* ---------- doc panel ---------- */
.panel-wrap { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
.panel-wrap.open { pointer-events: auto; }
.panel-wrap .veil { position: absolute; inset: 0; background: rgba(0, 29, 36, .32); opacity: 0; transition: opacity .18s; }
.panel-wrap.open .veil { opacity: 1; }
.panel {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 92vw);
  background: #fff; box-shadow: -8px 0 30px rgba(0, 29, 36, .18);
  transform: translateX(102%); transition: transform .2s ease-out;
  display: flex; flex-direction: column;
  border-top: 4px solid var(--brand);
}
.panel-wrap.open .panel { transform: none; }
.panel .p-head { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
.panel .p-head .codes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.panel .p-head h2 { margin: 0; font-size: 18px; line-height: 1.3; }
.panel .p-head .dom { color: var(--ink-soft); font-size: 12.5px; margin-top: 4px; }
.panel .p-close {
  position: absolute; top: 12px; right: 14px; border: none; background: var(--bg);
  border-radius: 8px; width: 32px; height: 32px; font-size: 16px; cursor: pointer; color: var(--ink-soft);
}
.panel .p-close:hover { background: var(--accent-soft); color: var(--accent); }
.panel .p-body { padding: 14px 22px 40px; overflow-y: auto; }
.panel .p-meta { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }

/* ---------- markdown body ---------- */
.md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.2em 0 .45em; }
.md h1 { font-size: 19px; } .md h2 { font-size: 16.5px; } .md h3 { font-size: 14.5px; } .md h4 { font-size: 13.5px; }
.md p { margin: .55em 0; }
.md ul, .md ol { margin: .5em 0; padding-left: 1.5em; }
.md li { margin: .22em 0; }
.md table { border-collapse: collapse; margin: .8em 0; font-size: 13px; width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--bg); }
.md blockquote { margin: .7em 0; padding: 6px 14px; border-left: 3px solid var(--brand); background: var(--accent-soft); border-radius: 0 6px 6px 0; }
.md code { background: var(--bg); border-radius: 4px; padding: 1px 5px; font-size: 12.5px; }
.md img { max-width: 100%; }
.md hr { border: none; border-top: 1px solid var(--line); margin: 1.2em 0; }

/* ---------- tables (scope / registers) ---------- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
.filters button {
  border: 1px solid var(--line); background: #fff; border-radius: 20px; padding: 5px 13px;
  font: inherit; font-size: 12.5px; cursor: pointer; color: var(--ink-soft);
}
.filters button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
table.reg { border-collapse: collapse; width: 100%; font-size: 13px; background: var(--card); }
table.reg th, table.reg td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
table.reg th { background: var(--accent-soft); color: var(--accent); position: sticky; top: -23px; }
table.reg tr.click { cursor: pointer; }
table.reg tr.click:hover td { background: var(--accent-soft); }
table.reg tr.dim td { color: var(--ink-soft); background: #fafbfc; }

.req-card, .gap-card { position: relative; }
.req-card h3, .gap-card h3 { margin: 0 0 6px; font-size: 15px; }
.req-card .src { color: var(--ink-soft); font-size: 12.5px; margin-bottom: 8px; }
.gap-card { border-left: 4px solid var(--fit-gap); }

.empty { color: var(--ink-soft); font-style: italic; padding: 30px 0; text-align: center; }

/* ---------- PDF export dialog ---------- */
.exp-wrap { position: fixed; inset: 0; z-index: 60; display: none; }
.exp-wrap.open { display: block; }
.exp-wrap .veil { position: absolute; inset: 0; background: rgba(0, 29, 36, .32); }
.exp {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: min(560px, 94vw); max-height: 86vh; overflow-y: auto;
  background: #fff; border-radius: 14px; border-top: 4px solid var(--brand);
  box-shadow: 0 18px 60px rgba(0, 29, 36, .3); padding: 22px 26px;
}
.exp h2 { margin: 0 0 4px; font-size: 18px; }
.exp .hint { color: var(--ink-soft); font-size: 12.5px; margin: 0 0 14px; }
.exp h3 { font-size: 13px; margin: 14px 0 6px; color: var(--ink-soft); font-weight: 600; letter-spacing: .3px; text-transform: uppercase; }
.exp label { display: flex; align-items: baseline; gap: 8px; padding: 4px 2px; font-size: 13.5px; cursor: pointer; }
.exp label .n { color: var(--ink-soft); font-size: 11.5px; min-width: 16px; font-weight: 600; }
.exp .doms { columns: 2; }
.exp .doms label { break-inside: avoid; }
.exp .row { display: flex; gap: 10px; margin-top: 18px; align-items: center; }
.exp .row .all { font-size: 12.5px; color: var(--accent); cursor: pointer; background: none; border: none; padding: 0; font-family: inherit; }
.exp .row .sp { flex: 1; }
.exp .row button.go {
  background: var(--brand); color: var(--ink); border: none; border-radius: 20px;
  padding: 8px 20px; font: 600 13.5px/1 inherit; font-family: inherit; cursor: pointer;
}
.exp .row button.go:hover { filter: brightness(.95); }
.exp .row button.cancel {
  background: none; border: 1px solid var(--line); border-radius: 20px;
  padding: 8px 16px; font-size: 13.5px; font-family: inherit; cursor: pointer; color: var(--ink-soft);
}

/* ---------- print document (built on export, rendered only by @media print) ---------- */
#printdoc { display: none; }

@media print {
  @page { size: A4; margin: 16mm 14mm 20mm; }
  html, body { height: auto; background: #fff; }
  /* interactive app never prints; the composed document does */
  body.printing #app, body.printing .exp-wrap { display: none !important; }
  body.printing #printdoc { display: block; }
  /* direct browser-print of the app (no export flow): degrade gracefully */
  body:not(.printing) .hdr nav, body:not(.printing) .side,
  body:not(.printing) .diagram-head .zoom { display: none !important; }
  body:not(.printing) .content { overflow: visible; }
  body:not(.printing) .panel-wrap { display: none; }

  #printdoc { font-size: 11.5pt; color: var(--cg-ink); }

  /* running header on every page after the cover: the <thead> of .pv-doc is
   * repeated by the browser at the top of each printed page */
  table.pv-doc { width: 100%; border-collapse: collapse; }
  table.pv-doc > * > tr > td { padding: 0; border: none; }
  .pv-run {
    display: flex; align-items: center; gap: 8px;
    font-size: 8pt; color: var(--ink-soft);
    border-bottom: .5pt solid var(--cg-cyan); padding: 0 0 2mm; margin-bottom: 7mm;
  }
  .pv-run .logo {
    width: 19mm; height: 4.2mm; margin-left: auto;
    background: var(--cg-logo-dark) no-repeat right center / contain;
  }

  /* ---- cover page ---- */
  .pv-cover { page-break-after: always; position: relative; height: 250mm; }
  .pv-cover .logo {
    width: 42mm; height: 9mm; margin: 4mm 0 0;
    background: var(--cg-logo-dark) no-repeat left center / contain;
  }
  .pv-cover .title { position: absolute; top: 118mm; left: 0; right: 24mm; }
  .pv-cover .title h1 { font-size: 30pt; line-height: 1.15; margin: 0 0 4mm; font-weight: 700; }
  .pv-cover .title .sub { font-size: 13pt; color: var(--ink-soft); margin: 0; }
  .pv-cover .meta { position: absolute; top: 168mm; left: 0; font-size: 10.5pt; color: var(--ink-soft); }
  .pv-cover .meta div { margin: 1mm 0; }
  .pv-cover .meta b { color: var(--cg-ink); font-weight: 600; }
  /* Cegeka cover artwork: layered brand-colour sweep, bottom-right */
  .pv-cover .art { position: absolute; right: -14mm; bottom: -18mm; width: 120mm; height: 74mm; overflow: hidden; }
  .pv-cover .art i { position: absolute; display: block; }
  .pv-cover .art .a1 { background: var(--cg-coral);  width: 120mm; height: 60mm; bottom: -6mm; right: -6mm; transform: rotate(-16deg); border-radius: 40mm 0 0 0; }
  .pv-cover .art .a2 { background: var(--cg-purple); width: 120mm; height: 52mm; bottom: -14mm; right: -10mm; transform: rotate(-10deg); border-radius: 36mm 0 0 0; }
  .pv-cover .art .a3 { background: var(--cg-cyan);   width: 130mm; height: 48mm; bottom: -16mm; right: -8mm; transform: rotate(-5deg); border-radius: 34mm 0 0 0; }

  /* ---- table of contents ---- */
  .pv-toc { page-break-after: always; }
  .pv-toc h2 { font-size: 16pt; margin: 0 0 8mm; }
  .pv-toc ol { list-style: none; padding: 0; margin: 0; font-size: 11.5pt; }
  .pv-toc li { display: flex; gap: 4mm; padding: 2mm 0; border-bottom: .5pt solid var(--cg-gray-light); }
  .pv-toc li .n { color: var(--cg-cyan-deep); font-weight: 700; min-width: 8mm; }

  /* ---- sections ---- */
  .pv-section { page-break-before: always; }
  .pv-section > h1 {
    font-size: 17pt; margin: 0 0 5mm; padding-bottom: 2.5mm;
    border-bottom: 1.2pt solid var(--cg-cyan);
  }
  .pv-section > h1 .n { color: var(--cg-cyan-deep); margin-right: 3mm; }
  .pv-intro { margin-bottom: 5mm; }
  .pv-diagram { page-break-inside: avoid; margin: 4mm 0 6mm; }
  .pv-diagram svg { width: 100%; height: auto; }
  .pv-legend { display: flex; gap: 5mm; flex-wrap: wrap; font-size: 8pt; color: var(--ink-soft); margin: 2mm 0 0; }
  .pv-legend span { display: inline-flex; align-items: center; gap: 1.5mm; }
  .pv-legend i { width: 3.2mm; height: 3.2mm; border-radius: 1mm; display: inline-block; border: .6mm solid; }

  .pv-scen { page-break-inside: avoid; margin: 0 0 6mm; padding: 0 0 4mm; border-bottom: .5pt solid var(--cg-gray-light); }
  .pv-scen .codes { font-size: 9pt; margin-bottom: 1mm; }
  .pv-scen .codes code { font-weight: 700; color: var(--cg-cyan-deep); font-family: ui-monospace, Consolas, monospace; }
  .pv-scen h3 { font-size: 12.5pt; margin: 0 0 2mm; }
  .pv-scen .chips { margin: 0 0 2mm; }
  .chip { border-radius: 20px; padding: .5mm 2.5mm; font-size: 8pt; }

  table.pv-table, #printdoc .md table { border-collapse: collapse; width: 100%; font-size: 9.5pt; }
  .pv-table th, .pv-table td, #printdoc .md th, #printdoc .md td {
    border: .5pt solid var(--cg-gray-light); padding: 1.5mm 2.5mm; text-align: left; vertical-align: top;
  }
  .pv-table th, #printdoc .md th { background: var(--cg-cyan-tint); color: var(--cg-ink); }
  .pv-table tr, #printdoc .md tr { page-break-inside: avoid; }

  #printdoc .md h1 { font-size: 13pt; } #printdoc .md h2 { font-size: 12pt; }
  #printdoc .md h3 { font-size: 11pt; } #printdoc .md h4 { font-size: 10.5pt; }
  #printdoc .md blockquote {
    margin: 2mm 0; padding: 1.5mm 4mm; border-left: 1mm solid var(--cg-cyan);
    background: var(--cg-cyan-tint); border-radius: 0 2mm 2mm 0;
  }
  #printdoc .md code { background: #f0f4f5; border-radius: 1mm; padding: 0 1mm; font-size: 9.5pt; }
  #printdoc a { color: var(--cg-cyan-deep); text-decoration: none; }
}

:root { --accent: #00305e; }

</style>

<script>
window.BPA = {"client": {"name": "Bakkerij Florax (demo)", "title": "Business Process Analyse", "period": "workshops mei 2026", "language": "nl", "intro_html": "<p>Dit document bevat een overzicht van de processen die voor <strong>Bakkerij Florax<\/strong> beheerd zullen worden in Microsoft Dynamics 365 Business Central, aangevuld met <strong>Aptean Food &amp; Beverage<\/strong> (lot management, expiration management) en <strong>Continia<\/strong> (Document Capture, Document Output). Per business scenario wordt beschreven hoe het proces zal verlopen: met standaardfunctionaliteit, met een add-on, via een workaround of — waar nodig — met maatwerk (zie het GAP-register).<\/p>\n<p>De specifieke zaken die beschreven zijn voor Bakkerij Florax vloeien voort uit de workshops gehouden in <strong>mei 2026<\/strong> met de key-users (verkoop, logistiek, kwaliteit en finance).<\/p>\n<p>Alle in dit document beschreven processen worden in scope genomen van het implementatieproject, tenzij anders aangeduid. Wat niet expliciet beschreven is in dit document zit niet in scope. Moesten er tijdens de implementatie nog extra zaken naar boven komen die niet mee in het projectbudget zijn opgenomen, kunnen deze met een aparte change request behandeld worden.<\/p>\n<h2>Leeswijzer<\/h2>\n<ul>\n<li><strong>Processen<\/strong> — kies links een domein: het procesdiagram toont de stappen in BPMN-notatie. Klik op een stap voor de documentatie van dat scenario.<\/li>\n<li><strong>Kleuren<\/strong> — blauw: standaard Business Central · paars: add-on · oranje: workaround · rood: GAP (maatwerk) · grijs gestippeld: stap zonder uitgewerkte documentatie in deze versie.<\/li>\n<li><strong>Scope<\/strong> — de volledige scopematrix met alle behandelde scenario's, ook wat expliciet buiten scope valt.<\/li>\n<li><strong>Requirements<\/strong> — de requirements uit de workshops, met bronvermelding en gekoppelde scenario's.<\/li>\n<li><strong>GAPs<\/strong> — het maatwerkregister.<\/li>\n<\/ul>\n<blockquote>\n<p>Dit is een <strong>demo-dossier<\/strong> met een fictieve klant, bedoeld om de werking van het<\/p>\n<p>BPA-systeem te tonen. De inhoud is illustratief.<\/p>\n<\/blockquote>", "labels": {}}, "meta": {"model": "Cegeka Process Model 3.01", "version": "0.9 — demo", "stack": {"bc": "BC24 (2024 wave 1), SaaS current", "aptean-fnb": "AppSource current — lot mgmt, expiration mgmt", "continia": "AppSource current — DC + DO"}, "generated": "2026-07-08"}, "domains": [{"number": 2, "title": "Verkoop", "intro_html": "<p>Florax verkoopt via drie kanalen: EDI-orders van twee retailketens (±60% van het volume), de eigen webshop en manuele intake (telefoon/mail). Het verkoopproces is daarop ingericht: geautomatiseerde orderintake waar het kan, met kanaalafhankelijke afspraken voor deelleveringen en facturatie. Er is geen offertetraject: prijzen liggen vast in klantprijslijsten en promoafspraken.<\/p>", "process": {"id": "verkoop", "domain": 2, "title": "Verkoop", "subtitle": "Van orderintake (EDI / webshop / manueel) tot betaalde factuur — klantspecifieke stroom Florax", "lanes": [{"id": "verkoop", "label": "Verkoop binnendienst"}, {"id": "magazijn", "label": "Magazijn"}, {"id": "finance", "label": "Finance"}], "nodes": [{"id": "start", "type": "start", "label": "Order ontvangen", "lane": "verkoop"}, {"id": "gw-kanaal", "type": "gateway", "label": "Kanaal?", "lane": "verkoop"}, {"id": "edi-import", "type": "task", "label": "Order automatisch importeren (EDI/webshop)", "lane": "verkoop", "scenario": "BS95.002"}, {"id": "order", "type": "task", "label": "Verkooporder maken / controleren", "lane": "verkoop", "scenario": "BS25.202"}, {"id": "toezegging", "type": "task", "label": "Leverdatum toetsen (ordertoezegging)", "lane": "verkoop", "scenario": "BS25.328"}, {"id": "reserveren", "type": "task", "label": "Voorraad reserveren (FEFO)", "lane": "verkoop", "scenario": "BS25.204"}, {"id": "verzenden", "type": "subprocess", "label": "Order picken en verzenden", "lane": "magazijn", "scenario": "BS25.205", "goto": "magazijnbeheer"}, {"id": "gw-volledig", "type": "gateway", "label": "Volledig geleverd?", "lane": "magazijn"}, {"id": "gw-retail", "type": "gateway", "label": "Retailklant?", "lane": "magazijn"}, {"id": "annuleren", "type": "task", "label": "Restant annuleren + keten verwittigen", "lane": "verkoop", "scenario": "BS25.207"}, {"id": "backorder", "type": "task", "label": "Backorder aanhouden en naleveren", "lane": "magazijn", "scenario": "BS25.206"}, {"id": "factuur", "type": "task", "label": "Factureren (verzamel wekelijks / per levering)", "lane": "finance", "scenario": "BS25.213"}, {"id": "factuur-boeken", "type": "task", "label": "Verkoopfactuur boeken + Peppol/EDI verzenden", "lane": "finance", "scenario": "BS25.214"}, {"id": "gw-retour", "type": "gateway", "label": "Kwaliteitsklacht?", "lane": "finance"}, {"id": "retour", "type": "task", "label": "Verkoopretourorder maken", "lane": "finance", "scenario": "BS25.219"}, {"id": "creditnota", "type": "task", "label": "Verkoopcreditnota maken", "lane": "finance", "scenario": "BS25.220"}, {"id": "end", "type": "end", "label": "Order afgehandeld", "lane": "finance"}], "flows": [{"from": "start", "to": "gw-kanaal"}, {"from": "gw-kanaal", "to": "edi-import", "label": "EDI / webshop"}, {"from": "edi-import", "to": "order"}, {"from": "gw-kanaal", "to": "order", "label": "telefoon / mail"}, {"from": "order", "to": "toezegging"}, {"from": "toezegging", "to": "reserveren"}, {"from": "reserveren", "to": "verzenden"}, {"from": "verzenden", "to": "gw-volledig"}, {"from": "gw-volledig", "to": "gw-retail", "label": "nee"}, {"from": "gw-retail", "to": "annuleren", "label": "ja"}, {"from": "annuleren", "to": "factuur"}, {"from": "gw-retail", "to": "backorder", "label": "nee"}, {"from": "backorder", "to": "verzenden", "label": "nalevering"}, {"from": "gw-volledig", "to": "factuur", "label": "ja"}, {"from": "factuur", "to": "factuur-boeken"}, {"from": "factuur-boeken", "to": "gw-retour"}, {"from": "gw-retour", "to": "retour", "label": "ja"}, {"from": "retour", "to": "creditnota"}, {"from": "creditnota", "to": "end"}, {"from": "gw-retour", "to": "end", "label": "nee"}]}, "scenarios": ["BS25.101", "BS25.202", "BS25.328", "BS25.206", "BS25.213"]}, {"number": 4, "title": "Voorraad", "intro_html": "<p>Volledige lottracering met THT-bewaking is voor Florax niet onderhandelbaar (IFS-certificering, FAVV-recalltest 2×/jaar). De voorraadinrichting steunt op de Aptean Food &amp; Beverage-laag bovenop standaard Business Central: lot management voor tracering en expiration management voor THT/FEFO. Waardering gebeurt volgens FIFO.<\/p>", "process": {"id": "voorraad", "domain": 4, "title": {"nl": "Voorraad", "en": "Inventory"}, "subtitle": {"nl": "Artikelbeheer, correcties en kwaliteit", "en": "Item management, adjustments and quality"}, "lanes": [{"id": "voorraadbeheer", "label": {"nl": "Voorraadbeheer", "en": "Inventory management"}}, {"id": "kwaliteit", "label": {"nl": "Kwaliteit", "en": "Quality"}}], "nodes": [{"id": "start", "type": "start", "label": {"nl": "Nieuw artikel of voorraadgebeurtenis", "en": "New item or inventory event"}, "lane": "voorraadbeheer"}, {"id": "artikel", "type": "task", "label": {"nl": "Artikel beheren", "en": "Manage item"}, "lane": "voorraadbeheer", "scenario": "BS50.100"}, {"id": "sku", "type": "task", "label": {"nl": "Stockkeeping units beheren", "en": "Manage stockkeeping units"}, "lane": "voorraadbeheer", "scenario": "BS50.101"}, {"id": "traceringscode", "type": "task", "label": {"nl": "Artikeltraceringscode toekennen", "en": "Assign item tracking code"}, "lane": "voorraadbeheer", "scenario": "BS50.104"}, {"id": "gw-gebeurtenis", "type": "gateway", "label": {"nl": "Welke gebeurtenis?", "en": "Which event?"}, "lane": "voorraadbeheer"}, {"id": "corrigeren", "type": "task", "label": {"nl": "Voorraad corrigeren", "en": "Adjust inventory"}, "lane": "voorraadbeheer", "scenario": "BS50.200"}, {"id": "inventarisatie", "type": "task", "label": {"nl": "Inventarisatie uitvoeren", "en": "Run physical inventory"}, "lane": "voorraadbeheer", "scenario": "BS50.201"}, {"id": "blokkeren", "type": "task", "label": {"nl": "Artikel/lot blokkeren", "en": "Block item/lot"}, "lane": "kwaliteit", "scenario": "BS45.200"}, {"id": "lot", "type": "task", "label": {"nl": "Lot management & traceability", "en": "Lot management & traceability"}, "lane": "kwaliteit", "scenario": "BS45.904"}, {"id": "ncr", "type": "task", "label": {"nl": "Non-conformance registreren", "en": "Record non-conformance"}, "lane": "kwaliteit", "scenario": "BS45.905"}, {"id": "gw-vrijgave", "type": "gateway", "label": {"nl": "Lot vrijgegeven?", "en": "Lot released?"}, "lane": "kwaliteit"}, {"id": "end", "type": "end", "label": {"nl": "Voorraad correct en beschikbaar", "en": "Inventory correct and available"}, "lane": "voorraadbeheer"}], "flows": [{"from": "start", "to": "artikel"}, {"from": "artikel", "to": "sku"}, {"from": "sku", "to": "traceringscode"}, {"from": "traceringscode", "to": "gw-gebeurtenis"}, {"from": "gw-gebeurtenis", "to": "corrigeren", "label": {"nl": "afwijking", "en": "adjustment"}}, {"from": "gw-gebeurtenis", "to": "inventarisatie", "label": {"nl": "telling", "en": "physical count"}}, {"from": "gw-gebeurtenis", "to": "blokkeren", "label": {"nl": "kwaliteitsissue", "en": "quality issue"}}, {"from": "blokkeren", "to": "lot"}, {"from": "lot", "to": "ncr"}, {"from": "ncr", "to": "gw-vrijgave"}, {"from": "gw-vrijgave", "to": "end", "label": {"nl": "ja", "en": "yes"}}, {"from": "gw-vrijgave", "to": "corrigeren", "label": {"nl": "nee, afboeken", "en": "no — write off"}}, {"from": "corrigeren", "to": "end"}, {"from": "inventarisatie", "to": "end"}]}, "scenarios": ["BS50.100", "BS50.104", "BS45.904", "BS45.902", "BS45.200"]}, {"number": 10, "title": "Finance", "intro_html": "<p>De financiële processen volgen standaard Business Central (Belgische lokalisatie: CODA, Intervat, Intrastat). De grootste verandering zit in de crediteurenstroom: de ±250 papieren inkoopfacturen per maand worden digitaal verwerkt en goedgekeurd via Continia Document Capture (zie domein 15).<\/p>", "process": {"id": "finance", "domain": 10, "title": {"nl": "Finance", "en": "Finance"}, "subtitle": {"nl": "Crediteuren, debiteuren en periodieke afsluiting", "en": "Payables, receivables and period-end closing"}, "lanes": [{"id": "crediteuren", "label": {"nl": "Crediteuren", "en": "Accounts payable"}}, {"id": "debiteuren", "label": {"nl": "Debiteuren", "en": "Accounts receivable"}}, {"id": "boekhouding", "label": {"nl": "Boekhouding", "en": "Accounting"}}], "nodes": [{"id": "start", "type": "start", "label": {"nl": "Financiële verwerking", "en": "Financial processing"}, "lane": "boekhouding"}, {"id": "split", "type": "gateway-parallel", "label": "", "lane": "boekhouding"}, {"id": "ap-factuur", "type": "task", "label": {"nl": "Inkoopfacturen registreren", "en": "Record purchase invoices"}, "lane": "crediteuren", "scenario": "BS65.200"}, {"id": "ap-goedkeuren", "type": "task", "label": {"nl": "Inkoopfactuur goedkeuren", "en": "Approve purchase invoice"}, "lane": "crediteuren", "scenario": "BS65.203"}, {"id": "ap-boeken", "type": "task", "label": {"nl": "Inkoopfacturen boeken", "en": "Post purchase invoices"}, "lane": "crediteuren", "scenario": "BS65.204"}, {"id": "ap-betalen", "type": "task", "label": {"nl": "Leveranciersbetalingen uitvoeren", "en": "Process vendor payments"}, "lane": "crediteuren", "scenario": "BS65.207"}, {"id": "ar-factuur", "type": "task", "label": {"nl": "Manuele verkoopfacturen registreren", "en": "Record manual sales invoices"}, "lane": "debiteuren", "scenario": "BS65.209"}, {"id": "ar-opvolgen", "type": "task", "label": {"nl": "Openstaande vorderingen opvolgen", "en": "Follow up open receivables"}, "lane": "debiteuren", "scenario": "BS65.213"}, {"id": "ar-aanmanen", "type": "task", "label": {"nl": "Aanmaningen beheren", "en": "Manage reminders"}, "lane": "debiteuren", "scenario": "BS65.214"}, {"id": "bank", "type": "task", "label": {"nl": "Dagafschriften verwerken en boeken", "en": "Process and post bank statements"}, "lane": "boekhouding", "scenario": "BS65.219"}, {"id": "divers", "type": "task", "label": {"nl": "Diverse boekingen registreren", "en": "Post general journal entries"}, "lane": "boekhouding", "scenario": "BS65.216"}, {"id": "btw", "type": "task", "label": {"nl": "Periodieke BTW-aangifte aanmaken", "en": "Create periodic VAT return"}, "lane": "boekhouding", "scenario": "BS65.222"}, {"id": "join", "type": "gateway-parallel", "label": "", "lane": "boekhouding"}, {"id": "rapporten", "type": "task", "label": {"nl": "Financiële rapporten aanmaken", "en": "Create financial reports"}, "lane": "boekhouding", "scenario": "BS65.218"}, {"id": "afsluiten", "type": "task", "label": {"nl": "Boekjaar/periode afsluiten", "en": "Close fiscal year/period"}, "lane": "boekhouding", "scenario": "BS65.234"}, {"id": "end", "type": "end", "label": {"nl": "Periode afgesloten", "en": "Period closed"}, "lane": "boekhouding"}], "flows": [{"from": "start", "to": "split"}, {"from": "split", "to": "ap-factuur"}, {"from": "ap-factuur", "to": "ap-goedkeuren"}, {"from": "ap-goedkeuren", "to": "ap-boeken"}, {"from": "ap-boeken", "to": "ap-betalen"}, {"from": "ap-betalen", "to": "join"}, {"from": "split", "to": "ar-factuur"}, {"from": "ar-factuur", "to": "ar-opvolgen"}, {"from": "ar-opvolgen", "to": "ar-aanmanen"}, {"from": "ar-aanmanen", "to": "join"}, {"from": "split", "to": "bank"}, {"from": "bank", "to": "divers"}, {"from": "divers", "to": "btw"}, {"from": "btw", "to": "join"}, {"from": "join", "to": "rapporten"}, {"from": "rapporten", "to": "afsluiten"}, {"from": "afsluiten", "to": "end"}]}, "scenarios": ["BS65.200", "BS65.204"]}, {"number": 12, "title": "Interfaces", "intro_html": "<p>Florax koppelt Business Central met de twee retailketens (EDI) en met de eigen webshop. Beide lopen over het EDI/integratieframework, maar de webshopkoppeling vraagt maatwerkmapping in twee richtingen.<\/p>", "process": null, "scenarios": ["BS95.002"]}, {"number": 15, "title": "Continia", "intro_html": "<p>Continia Document Capture digitaliseert de crediteurenstroom; Document Output verzorgt de elektronische facturatie via Peppol.<\/p>", "process": null, "scenarios": ["BS65.253", "BS65.254", "BS65.256"]}], "scenarios": {"BS25.101": {"code": "BS25.101", "title": "Beheren verkoopprijzen", "section": "2.2.2", "domain": 2, "fit": "standard", "addon": null, "gap": null, "requirements": ["REQ-004"], "html": "<p>Per klant(groep) wordt een verkoopprijslijst aangelegd in Business Central. De promoperiodes die vandaag in Excel beheerd worden, worden datumbegrensde prijslijstregels: een actieprijs met begin- en einddatum die tijdens de promoperiode automatisch voorrang krijgt op de basisprijs. Bij het ingeven of importeren van een order bepaalt BC de geldige prijs op orderdatum — de foutgevoelige manuele opzoeking vervalt.<\/p>\n<p>Prijslijsten worden beheerd door de verkoopbinnendienst; een goedkeuringsdatum en status (concept/actief) voorkomen dat onafgewerkte prijzen gebruikt worden.<\/p>"}, "BS25.202": {"code": "BS25.202", "title": "Verkooporders maken", "section": "2.5.1", "domain": 2, "fit": "standard", "addon": null, "gap": null, "requirements": ["REQ-001"], "html": "<p>Alle kanalen monden uit in één en hetzelfde verkooporder in Business Central:<\/p>\n<ul>\n<li><strong>EDI-retail en webshop<\/strong>: orders komen automatisch binnen via het integratieframework (zie BS95.002) en worden als verkooporder aangemaakt met klant, artikelen, aantallen en gevraagde leverdatum reeds ingevuld. De binnendienst controleert enkel uitval (onbekend artikel, afwijkende prijs).<\/li>\n<li><strong>Telefoon/mail<\/strong>: manuele ingave door de binnendienst; klantgegevens, leveradres en prijzen worden automatisch uit de klantenfiche en prijslijsten overgenomen.<\/li>\n<\/ul>\n<p>Na volledige ingave wordt het order vrijgegeven richting magazijn. Er is geen interne goedkeuringsflow op verkooporders: prijscontrole gebeurt vooraf via de prijslijsten.<\/p>"}, "BS25.328": {"code": "BS25.328", "title": "Ordertoezegging", "section": "2.5.12", "domain": 2, "fit": "standard", "addon": null, "gap": null, "requirements": ["REQ-003"], "html": "<p>Voor de retailorders met een harde leverdatum gebruikt de binnendienst de standaard ordertoezeggingsfunctionaliteit (order promising): bij het ingeven van de orderregel berekent BC op basis van voorraad en geplande ontvangsten de vroegst haalbare verzenddatum. Regels die de gevraagde leverdatum niet halen, kleuren onmiddellijk af — vóór bevestiging aan de keten, niet pas bij het picken. Zo worden boetes voor gemiste leverdata vermeden.<\/p>"}, "BS25.206": {"code": "BS25.206", "title": "Beheer van backorders", "section": "2.5.5", "domain": 2, "fit": "standard", "addon": null, "gap": null, "requirements": ["REQ-002"], "html": "<p>Het backorderbeleid verschilt per kanaal en wordt gestuurd via het veld <em>Verzendadvies<\/em> op de klantenfiche:<\/p>\n<ul>\n<li><strong>Retailketens<\/strong> — geen backorders: wat bij verzending niet mee kan, wordt op het order geannuleerd zodat het order administratief afgesloten wordt en de keten een correcte pakbon krijgt. De binnendienst verwittigt de keten vóór levering.<\/li>\n<li><strong>Webshop- en telefoonklanten<\/strong> — restsaldo blijft als backorder openstaan en wordt automatisch mee opgenomen in de eerstvolgende picking zodra er voorraad is.<\/li>\n<\/ul>"}, "BS25.213": {"code": "BS25.213", "title": "Verkoopfacturen maken", "section": "2.6.1", "domain": 2, "fit": "standard", "addon": null, "gap": "GAP-2", "requirements": ["REQ-005"], "html": "<p>Facturatie volgt twee ritmes:<\/p>\n<ul>\n<li><strong>Retailketens<\/strong>: wekelijks een verzamelfactuur per keten. De geboekte verzendingen van de week worden via <em>Verzamelfacturen<\/em> (gecombineerde verzendingen) op één verkoopfactuur samengebracht.<\/li>\n<li><strong>Overige klanten<\/strong>: factuur per levering, automatisch aangemaakt bij het boeken van de verzending.<\/li>\n<\/ul>\n<p>Alle verkoopfacturen vertrekken elektronisch via Peppol (zie BS65.256); de retailketens ontvangen daarnaast hun vertrouwde EDI INVOIC-bericht. De specifieke lay-outvereisten van de ketens zijn opgenomen in het GAP-register (GAP-2).<\/p>"}, "BS50.100": {"code": "BS50.100", "title": "Artikelen beheren", "section": "4.2.1", "domain": 4, "fit": "standard", "addon": null, "gap": null, "requirements": [], "html": "<p>Grondstoffen, verpakkingen en eindproducten (diepvriespatisserie) worden als artikelen aangelegd met artikelcategorieën per productgroep. Elk traceerplichtig artikel krijgt een artikeltraceringscode (zie BS50.104) en een houdbaarheidsformule waarmee BC de THT berekent bij productie of ontvangst. Waarderingsmethode: FIFO.<\/p>"}, "BS50.104": {"code": "BS50.104", "title": "Artikeltraceringscodes beheren", "section": "4.2.4", "domain": 4, "fit": "standard", "addon": null, "gap": null, "requirements": ["REQ-007"], "html": "<p>Er worden twee traceringscodes ingericht: <code>LOT-VOLLEDIG<\/code> (lotverplicht bij ontvangst, verbruik, productie en verzending) voor grondstoffen en eindproducten, en <code>GEEN<\/code> voor niet-traceerplichtige hulpstoffen en verpakking zonder voedselcontact. Daarmee is elke voorraadbeweging van traceerplichtige artikelen naar lot herleidbaar — de basis voor de recallvereiste van 4 uur.<\/p>"}, "BS45.904": {"code": "BS45.904", "title": "Lot management", "section": "4.5.4", "domain": 4, "fit": "addon", "addon": "Aptean Food & Beverage", "gap": null, "requirements": ["REQ-007"], "html": "<p>De Aptean-lotmanagementlaag breidt de standaard BC-lottracering uit met de traceringscockpit: vanuit één scherm wordt een lot in beide richtingen getraceerd — van grondstoflot naar alle eindproductloten en afnemers (forward) en van eindproductlot terug naar alle gebruikte grondstofloten en leveranciers (backward). De FAVV-recalltest die vandaag een dag Excel-werk kost, wordt daarmee een rapport van enkele minuten, ruim binnen de 4-uursvereiste.<\/p>\n<p>Lotnummers worden automatisch toegekend volgens een nummerreeks per productiedatum; leverancierslotnummers worden bij ontvangst mee geregistreerd.<\/p>"}, "BS45.902": {"code": "BS45.902", "title": "Expiration management", "section": "4.5.3", "domain": 4, "fit": "addon", "addon": "Aptean Food & Beverage", "gap": null, "requirements": ["REQ-008"], "html": "<p>THT-beheer en uitleverregels:<\/p>\n<ul>\n<li>Elke lot krijgt bij productie/ontvangst automatisch zijn THT op basis van de houdbaarheidsformule van het artikel.<\/li>\n<li>Picken gebeurt <strong>FEFO<\/strong>: het lot met de kortste resthoudbaarheid eerst.<\/li>\n<li>Voor de retailketens geldt de <strong>2/3-resthoudbaarheidsregel<\/strong>: per klant(groep) wordt een minimale resthoudbaarheid ingesteld; loten die daar niet meer aan voldoen, biedt het systeem niet meer aan voor die klant en blijven beschikbaar voor kanalen zonder die eis.<\/li>\n<\/ul>"}, "BS45.200": {"code": "BS45.200", "title": "Artikelen blokkeren", "section": "4.5.1", "domain": 4, "fit": "workaround", "addon": null, "gap": null, "requirements": ["REQ-009"], "html": "<p>Florax heeft geen QC-labomodule in scope. De kwaliteitsvrijgave wordt daarom opgevangen met een afgesproken werkwijze op de standaard lotstatussen (Aptean status management, zie BS10.904):<\/p>\n<ol>\n<li>Elk productielot krijgt bij output automatisch de status <strong>GEBLOKKEERD-QC<\/strong> — het lot is dan niet pickbaar en niet verzendbaar.<\/li>\n<li>Na de labo-uitslag (±4 u) zet de kwaliteitsverantwoordelijke de status digitaal op <strong>VRIJGEGEVEN<\/strong> (of <strong>AFGEKEURD<\/strong>, waarna afboeking of herbestemming volgt).<\/li>\n<li>De statuswijziging wordt gelogd (gebruiker + tijdstip) — dat vervangt het papieren vrijgaveformulier en volstaat voor de IFS-audittrail.<\/li>\n<\/ol>\n<p>De labo-uitslag zelf (meetwaarden) wordt niet in BC geregistreerd; die blijft in het labosysteem. Enkel de beslissing (vrijgave/afkeuring) komt in BC. Als dit later onvoldoende blijkt, is de Aptean QC-module de opstap — dat is dan een change request.<\/p>"}, "BS65.200": {"code": "BS65.200", "title": "Inkoopfacturen maken", "section": "10.3.3", "domain": 10, "fit": "standard", "addon": null, "gap": null, "requirements": ["REQ-010"], "html": "<p>Inkoopfacturen komen binnen via de centrale mailbox of Peppol en worden door Document Capture herkend en als conceptfactuur in BC geregistreerd (variant <em>Inkoopfactuur maken via OCR<\/em>, BC65.200.04 — zie BS65.253). Facturen met een inkooporder worden regel per regel gematcht met de ontvangsten; prijs- of hoeveelheidsafwijkingen buiten de tolerantie gaan automatisch naar de goedkeuringsflow. Kostenfacturen zonder order krijgen hun grootboekrekening via herkenningsregels per leverancier.<\/p>"}, "BS65.204": {"code": "BS65.204", "title": "Inkoopfacturen boeken", "section": "10.3.7", "domain": 10, "fit": "standard", "addon": null, "gap": null, "requirements": ["REQ-010"], "html": "<p>Na goedkeuring (zie BS65.254) wordt de factuur geboekt. De betaaltermijn en skontocondities komen van de leveranciersfiche, zodat kortingen voor snelle betaling — die vandaag verloren gaan door de papieren doorlooptijd van drie weken — gehaald worden. Het originele PDF-document blijft aan de geboekte factuur gekoppeld en is vanuit de boeking raadpleegbaar (bewijsstuk voor de audit).<\/p>"}, "BS95.002": {"code": "BS95.002", "title": "EDI framework", "section": "12.1.1", "domain": 12, "fit": "gap", "addon": null, "gap": "GAP-1", "requirements": ["REQ-001", "REQ-006"], "html": "<p>Het integratieframework verwerkt de inkomende berichten:<\/p>\n<ul>\n<li><strong>Retail-EDI (ORDERS)<\/strong>: de bestaande berichten van beide ketens worden gemapt naar verkooporders. Bestaande flows kunnen per keten gekopieerd en bijgestuurd worden — dit is configuratie binnen het framework.<\/li>\n<li><strong>Webshoporders<\/strong>: de webshop (eigen bouw) levert orders aan in JSON via de centrale webservice; na validatie worden ze automatisch verkooporders.<\/li>\n<li><strong>Uitgaand — voorraadstanden naar de webshop<\/strong>: periodieke export (per kwartier) van beschikbare voorraad per artikel naar de webshop, en EDI INVOIC naar de retailketens.<\/li>\n<\/ul>\n<p>De koppeling met de webshop vraagt maatwerk aan webshopzijde én een specifieke mapping/exportprofiel in BC — omvang en aannames staan in <strong>GAP-1<\/strong>. De foutafhandeling loopt via de inbox-/outboxtransacties van het framework: uitval is zichtbaar, corrigeerbaar en herverwerkbaar zonder tussenkomst van IT.<\/p>"}, "BS65.253": {"code": "BS65.253", "title": "Verwerken binnenkomende facturen met OCR", "section": "15.1.1", "domain": 15, "fit": "addon", "addon": "Continia Document Capture", "gap": null, "requirements": ["REQ-010"], "html": "<p>Inkoopfacturen (PDF via de centrale mailbox, of rechtstreeks via Peppol) worden automatisch geïmporteerd en met OCR herkend: leverancier, factuurnummer, datums, bedragen en BTW. Per leverancier leert het sjabloon bij, zodat de herkenningsgraad na de eerste weken hoog ligt. Na validatie registreert Document Capture het document als niet-geboekte inkoopfactuur in BC; het originele PDF-bestand blijft gekoppeld tot en met de geboekte factuur.<\/p>"}, "BS65.254": {"code": "BS65.254", "title": "Goedkeuring van documenten", "section": "15.1.2", "domain": 15, "fit": "addon", "addon": "Continia Document Capture", "gap": null, "requirements": ["REQ-010"], "html": "<p>De goedkeuringsflow volgt de afgesproken bevoegdheden: de aankoper keurt goed tot €5.000, daarboven gaat de factuur naar de zaakvoerder. Goedkeuren kan in BC zelf of via de <strong>Continia Web Approval Portal<\/strong> in een webbrowser of op de smartphone — daarmee kan de zaakvoerder ook op verplaatsing goedkeuren, met het originele factuurbeeld op het scherm. Opmerkingen, doorsturen en in-wacht-zetten zijn standaard mogelijk; elke stap wordt gelogd.<\/p>"}, "BS65.256": {"code": "BS65.256", "title": "PEPPOL", "section": "15.2.2", "domain": 15, "fit": "addon", "addon": "Continia Document Output", "gap": null, "requirements": ["REQ-005"], "html": "<p>Alle verkoopfacturen en -creditnota's vertrekken als Peppol BIS-bericht; Continia is zelf officiële Peppol service provider, dus er is geen aparte accesspoint-partij nodig. Voor de retailketens blijft daarnaast het bestaande EDI INVOIC-bericht via het integratieframework lopen (zie BS95.002 en GAP-2 voor de lay-outvereisten).<\/p>"}}, "coverage": [{"code": "BS25.101", "title": "Beheren verkoopprijzen", "domain": 2, "scope": true, "fit": "standard", "addon": null, "gap": null, "note": "Prijslijsten + promoperiodes vervangen Excel"}, {"code": "BS25.200", "title": "Verkoopoffertes maken", "domain": 2, "scope": false, "fit": null, "addon": null, "gap": null, "note": "Geen offertetraject: vaste prijslijsten"}, {"code": "BS25.202", "title": "Verkooporders maken", "domain": 2, "scope": true, "fit": "standard", "addon": null, "gap": null, "note": "Drie kanalen, één orderstroom"}, {"code": "BS25.328", "title": "Ordertoezegging", "domain": 2, "scope": true, "fit": "standard", "addon": null, "gap": null, "note": "Haalbaarheid leverdatum retail bij ingave"}, {"code": "BS25.206", "title": "Beheer van backorders", "domain": 2, "scope": true, "fit": "standard", "addon": null, "gap": null, "note": "Kanaalafhankelijk via verzendadvies"}, {"code": "BS25.213", "title": "Verkoopfacturen maken", "domain": 2, "scope": true, "fit": "standard", "addon": null, "gap": null, "note": "Verzamelfactuur retail wekelijks; lay-out zie GAP-2"}, {"code": "BS25.900", "title": "Advanced pricing (Aptean)", "domain": 2, "scope": false, "fit": null, "addon": null, "gap": null, "note": "Standaard prijslijsten volstaan (herbekijken bij bonusafspraken)"}, {"code": "BS50.100", "title": "Artikelen beheren", "domain": 4, "scope": true, "fit": "standard", "addon": null, "gap": null, "note": "FIFO, houdbaarheidsformules"}, {"code": "BS50.104", "title": "Artikeltraceringscodes beheren", "domain": 4, "scope": true, "fit": "standard", "addon": null, "gap": null, "note": "LOT-VOLLEDIG voor traceerplichtige artikelen"}, {"code": "BS40.900", "title": "Catch weight", "domain": 4, "scope": false, "fit": null, "addon": null, "gap": null, "note": "Alles op stuks/dozen — geen variabel gewicht"}, {"code": "BS45.200", "title": "Artikelen blokkeren", "domain": 4, "scope": true, "fit": "workaround", "addon": null, "gap": null, "note": "QC-vrijgave via lotstatussen, geen labomodule"}, {"code": "BS45.902", "title": "Expiration management", "domain": 4, "scope": true, "fit": "addon", "addon": "Aptean Food & Beverage", "gap": null, "note": "FEFO + 2/3-resthoudbaarheidsregel retail"}, {"code": "BS45.904", "title": "Lot management", "domain": 4, "scope": true, "fit": "addon", "addon": "Aptean Food & Beverage", "gap": null, "note": "Traceringscockpit; recall < 4 u"}, {"code": "BS60.202", "title": "Aanmaken van een serviceorder", "domain": 9, "scope": false, "fit": null, "addon": null, "gap": null, "note": "Geen serviceactiviteiten"}, {"code": "BS65.200", "title": "Inkoopfacturen maken", "domain": 10, "scope": true, "fit": "standard", "addon": null, "gap": null, "note": "Via OCR-variant (BC65.200.04)"}, {"code": "BS65.204", "title": "Inkoopfacturen boeken", "domain": 10, "scope": true, "fit": "standard", "addon": null, "gap": null, "note": "Skonto's halen dankzij kortere doorlooptijd"}, {"code": "BS95.002", "title": "EDI framework", "domain": 12, "scope": true, "fit": "gap", "addon": null, "gap": "GAP-1", "note": "Retail-EDI = configuratie; webshop = maatwerk"}, {"code": "BS65.253", "title": "Verwerken binnenkomende facturen met OCR", "domain": 15, "scope": true, "fit": "addon", "addon": "Continia Document Capture", "gap": null, "note": "±250 facturen/maand"}, {"code": "BS65.254", "title": "Goedkeuring van documenten", "domain": 15, "scope": true, "fit": "addon", "addon": "Continia Document Capture", "gap": null, "note": "Web Approval Portal voor zaakvoerder"}, {"code": "BS65.256", "title": "PEPPOL", "domain": 15, "scope": true, "fit": "addon", "addon": "Continia Document Output", "gap": null, "note": "Mandaat vanaf go-live"}], "requirements": [{"id": "REQ-001", "title": "Orderintake via drie kanalen (EDI, webshop, manueel)", "source": "2026-05-12-verkoop-transcript.md §2", "scenarios": ["BS25.202", "BS95.002"], "html": "<blockquote>\n<p>\"De twee retailketens sturen EDI-orders, dat is zowat 60 procent van het volume.<\/p>\n<p>Dan de webshop voor de kleinere afnemers, en de rest komt per telefoon of mail.\"<\/p>\n<\/blockquote>\n<p>EDI-orders van 2 retailketens en webshoporders moeten automatisch verkooporders worden; manuele intake blijft voor telefoon/mail.<\/p>"}, {"id": "REQ-002", "title": "Kanaalafhankelijk backorderbeleid", "source": "2026-05-12-verkoop-transcript.md §4", "scenarios": ["BS25.206"], "html": "<blockquote>\n<p>\"Retail mag nooit een deellevering krijgen zonder verwittiging — wat niet mee kan,<\/p>\n<p>valt af, geen backorder. Voor webshop- en telefoonklanten houden we het saldo aan.\"<\/p>\n<\/blockquote>\n<p>Retailklanten: restant annuleren bij deellevering. Overige klanten: backorder aanhouden en naleveren.<\/p>"}, {"id": "REQ-003", "title": "Leverbetrouwbaarheid retail zichtbaar bij orderingave", "source": "2026-05-12-verkoop-transcript.md §5", "scenarios": ["BS25.328"], "html": "<blockquote>\n<p>\"De retailorders hebben een leverdatum die heilig is. We willen bij het ingeven al<\/p>\n<p>zien of het haalbaar is.\"<\/p>\n<\/blockquote>\n<p>Beschikbaarheids-/datumtoezegging (order promising) bij orderingave.<\/p>"}, {"id": "REQ-004", "title": "Klantprijslijsten met promoperiodes", "source": "2026-05-12-verkoop-transcript.md §7", "scenarios": ["BS25.101"], "html": "<blockquote>\n<p>\"Per klant een prijslijst, en daarboven promoperiodes. Nu in Excel, foutgevoelig.\"<\/p>\n<\/blockquote>\n<p>Klantspecifieke prijslijsten plus datumbegrensde actieprijzen die de basisprijs tijdelijk overschrijven.<\/p>"}, {"id": "REQ-005", "title": "Facturatie: verzamelfactuur retail, Peppol voor iedereen", "source": "2026-05-12-verkoop-transcript.md §8; 2026-05-20-voorraad-finance-notes.md §6", "scenarios": ["BS25.213", "BS65.256"], "html": "<blockquote>\n<p>\"Retail wil wekelijks een verzamelfactuur, de rest factuur per levering. En alles<\/p>\n<p>moet via Peppol kunnen tegen de mandaatdatum.\"<\/p>\n<\/blockquote>\n<p>Wekelijkse verzamelfacturatie per retailketen; overige klanten per levering; alle verkoopfacturen via Peppol, retail daarnaast via EDI INVOIC.<\/p>"}, {"id": "REQ-006", "title": "Webshopkoppeling (orders in, voorraad terug)", "source": "2026-05-12-verkoop-transcript.md §10", "scenarios": ["BS95.002"], "html": "<blockquote>\n<p>\"Orders moeten er automatisch in, en de webshop moet voorraadstanden terugkrijgen.<\/p>\n<p>Dat is voor ons de grootste zorg van het hele project.\"<\/p>\n<\/blockquote>\n<p>Tweerichtingskoppeling met de bestaande (eigen) webshop: inkomende orders, uitgaande voorraadstanden.<\/p>"}, {"id": "REQ-007", "title": "Volledige lottracering met THT, recall binnen 4 uur", "source": "2026-05-20-voorraad-finance-notes.md §1", "scenarios": ["BS45.904", "BS50.104"], "html": "<blockquote>\n<p>\"Elke grondstof- en eindproductbeweging moet naar lot herleidbaar zijn, mét THT.<\/p>\n<p>Recall moet binnen 4 uur een volledige tracering opleveren.\"<\/p>\n<\/blockquote>\n<p>Lottracering end-to-end (IFS + FAVV); tracering in beide richtingen op te vragen.<\/p>"}, {"id": "REQ-008", "title": "FEFO-uitlevering met resthoudbaarheidsregel retail", "source": "2026-05-20-voorraad-finance-notes.md §2", "scenarios": ["BS45.902"], "html": "<blockquote>\n<p>\"Resthoudbaarheid bij levering aan retail minimaal 2/3 van de totale houdbaarheid.<\/p>\n<p>Uitleveren gebeurt FEFO.\"<\/p>\n<\/blockquote>\n<p>THT-bewaking per lot; picken volgens FEFO; blokkeren van loten die de 2/3-resthoudbaarheidsregel voor retail niet meer halen.<\/p>"}, {"id": "REQ-009", "title": "Kwaliteitsvrijgave van productieloten", "source": "2026-05-20-voorraad-finance-notes.md §3", "scenarios": ["BS45.200", "BS10.904"], "html": "<blockquote>\n<p>\"Kwaliteit blokkeert loten na productie tot de labo-uitslag binnen is. Vrijgave nu<\/p>\n<p>op papier.\"<\/p>\n<\/blockquote>\n<p>Loten na productie automatisch geblokkeerd; digitale vrijgave door kwaliteit.<\/p>"}, {"id": "REQ-010", "title": "Digitale verwerking en goedkeuring inkoopfacturen", "source": "2026-05-20-voorraad-finance-notes.md §4–5", "scenarios": ["BS65.253", "BS65.254", "BS65.200", "BS65.204"], "html": "<blockquote>\n<p>\"± 250 inkoopfacturen/maand, vandaag manueel ingetikt en op papier ter goedkeuring<\/p>\n<p>rondgedragen. De zaakvoerder wil goedkeuren vanop verplaatsing.\"<\/p>\n<\/blockquote>\n<p>OCR-verwerking van inkoopfacturen; goedkeuringsflow aankoper ≤ €5.000, daarboven zaakvoerder; goedkeuren via webbrowser/mobiel.<\/p>\n<p>&lt;!-- Next ID: REQ-011 --&gt;<\/p>"}], "gaps": [{"id": "GAP-1", "title": "Webshopkoppeling: orders in, voorraadstanden terug", "scenarios": ["BS95.002"], "html": "<p>De webshop is eigen bouw en blijft behouden. Het EDI/integratieframework dekt de berichtafhandeling (webservice, validatie, inbox/outbox, foutafhandeling), maar er is maatwerk nodig op twee punten:<\/p>\n<ol>\n<li><strong>Inkomend<\/strong> — de webshop levert vandaag geen JSON in de structuur die het framework verwacht; de webshopleverancier bouwt de aanroep van de centrale webservice, en in BC wordt de mapping webshoporder → verkooporder geconfigureerd (klantidentificatie via e-mail/klantnummer, artikelmapping via webshop-SKU).<\/li>\n<li><strong>Uitgaand<\/strong> — een exportprofiel \"beschikbare voorraad per artikel\" dat elk kwartier naar de webshop-API publiceert, inclusief de THT-regel: enkel loten die nog verkoopbaar zijn tellen mee als beschikbaar.<\/li>\n<\/ol>\n<p>Aannames: de webshop kan een REST-endpoint aanbieden voor de voorraadfeed; het bestaande klant- en artikelbestand van de webshop wordt vóór go-live gealigneerd op de BC-nummering.<\/p>"}, {"id": "GAP-2", "title": "Factuurlay-out en EDI INVOIC retailketens", "scenarios": ["BS25.213"], "html": "<p>De twee retailketens stellen eigen eisen aan de wekelijkse verzamelfactuur: eigen referenties (GLN, contractnummer, actiecodes) op regel- én documentniveau, en daarnaast het EDI INVOIC-bericht in het bestaande formaat van elke keten. De standaard factuurlay-out en de standaard Peppol-output dekken dit niet:<\/p>\n<ul>\n<li>aangepaste verzamelfactuurlay-out per keten (dataset-uitbreiding + lay-out), en<\/li>\n<li>twee uitgaande INVOIC-mappings in het integratieframework (per keten één), gevoed vanuit de geboekte verkoopfactuur.<\/li>\n<\/ul>\n<p>&lt;!-- Next ID: GAP-3 --&gt;<\/p>"}]};
</script>
